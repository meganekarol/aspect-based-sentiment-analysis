[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "absa"
version = "1.0.0"
description = "Aspect-Based Sentiment Analysis with three interchangeable back-ends: rule-based (spaCy + VADER), Transformer (DeBERTa-v3) and local LLM (Ollama)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Megane Fomo" }, { name = "Lesly Tianga" }]
keywords = ["nlp", "sentiment-analysis", "absa", "spacy", "transformers", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "spacy>=3.7,<4",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
transformer = ["transformers>=4.40", "torch>=2.2", "sentencepiece>=0.2", "protobuf>=4.25"]
llm = ["ollama>=0.3"]
demo = ["streamlit>=1.35", "pandas>=2.0"]
eval = ["pandas>=2.0", "matplotlib>=3.8"]
notebooks = ["pandas>=2.0", "numpy>=1.26", "matplotlib>=3.8", "seaborn>=0.13", "jupyter"]
all = ["absa[transformer,llm,demo,eval]"]
dev = ["absa[llm]", "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
absa = "absa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: downloads/loads Hugging Face transformer models",
    "llm: needs a running Ollama server",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["absa"]
